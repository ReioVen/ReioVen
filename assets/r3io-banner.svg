<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="R3IO">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4c4a4"/>
      <stop offset="45%" stop-color="#c4b08a"/>
      <stop offset="100%" stop-color="#8f7d5a"/>
    </linearGradient>
    <linearGradient id="fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#0c0c0e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#c4b08a" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#c4b08a" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#0c0c0e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="220" rx="16" fill="url(#fade)"/>
  <rect width="900" height="220" rx="16" fill="url(#grid)"/>
  <rect width="900" height="220" rx="16" fill="url(#glow)"/>
  <rect x="1" y="1" width="898" height="218" rx="15" fill="none" stroke="#c4b08a" stroke-opacity="0.22" stroke-width="1"/>

  <!-- left accent bar -->
  <rect x="0" y="48" width="4" height="124" rx="2" fill="url(#gold)"/>

  <text
    x="450"
    y="118"
    text-anchor="middle"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="84"
    font-weight="700"
    letter-spacing="18"
    fill="url(#gold)"
    filter="url(#softGlow)"
  >R3IO</text>

  <text
    x="450"
    y="158"
    text-anchor="middle"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="14"
    font-weight="500"
    letter-spacing="6"
    fill="#a0a0a6"
  >FULL-STACK · AI · PRODUCT</text>

  <!-- underline accent -->
  <rect x="355" y="172" width="190" height="2" rx="1" fill="url(#gold)" opacity="0.85">
    <animate attributeName="width" values="40;190;40" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="x" values="430;355;430" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;0.95;0.35" dur="4.5s" repeatCount="indefinite"/>
  </rect>
</svg>
